# ==============================================================================
# Render Blueprint Specification for FinRAG Vault (100% FREE TIER)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Qdrant Vector Database
  # ----------------------------------------------------------------------------
  - type: web
    name: qdrant
    env: docker
    dockerfilePath: ./qdrant.Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: "6333"

  # ----------------------------------------------------------------------------
  # 2. FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: finrag-vault-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      # Application general configuration
      - key: APP_NAME
        value: FinRAG Vault
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

      # Database Configuration
      - key: DATABASE_URL
        fromDatabase:
          name: finrag-vault-db
          property: connectionString

      # Qdrant Internal Network Configuration
      - key: QDRANT_HOST
        value: qdrant
      - key: QDRANT_PORT
        value: "6333"
      - key: QDRANT_COLLECTION
        value: finrag_vault

      # Security & JWT Tokens
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      # File Upload System (Ephemeral on Free Tier)
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: MAX_UPLOAD_SIZE
        value: "52428800"

      # RAG ML Models
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: RERANK_MODEL
        value: cross-encoder/ms-marco-MiniLM-L-6-v2

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database Instance
# ------------------------------------------------------------------------------
databases:
  - name: finrag-vault-db
    plan: free
    databaseName: finrag_vault
